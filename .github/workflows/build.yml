name: Build Theos Package

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  THEOS: /Users/runner/theos
  THEOS_PACKAGE_SCHEME: roothide
  SDKVERSION: '17.1'
  TARGET: iphone:clang:17.1:15.0
  ARCHS: arm64e

jobs:
  build:
    name: Build Tweak (Rootless arm64e)
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Print runner info
        shell: bash -euxo pipefail {0}
        run: |
          uname -a
          sw_vers || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true
          which git make clang xcrun ldid dpkg-deb || true
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

      - name: Install Homebrew dependencies
        shell: bash -euxo pipefail {0}
        run: |
          set +e
          brew install --formula ldid xz gnu-tar pkg-config make dpkg 2>&1 | tail -50
          set -e
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/dpkg/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Cache Theos + SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/theos
          key: ${{ runner.os }}-roothide-theos-v3-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-roothide-theos-v3-
            ${{ runner.os }}-roothide-theos-v2-
            ${{ runner.os }}-roothide-theos-

      - name: Install RootHide Theos + SDKs
        if: steps.cache-theos.outputs.cache-hit != 'true'
        shell: bash -euxo pipefail {0}
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "Installing RootHide-aware Theos to $THEOS ..."

          if [ -d "$THEOS" ]; then
              echo "Removing stale $THEOS to avoid unrelated histories ..."
              rm -rf "$THEOS"
          fi

          # 先拿官方 Theos（稳定、clone 稳定）
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          # 叠加 Roothide 专有文件 (vendor/lib / include patches) —— 不替换整个 Theos 目录
          TMP_ROOTHIDE="$HOME/.tmp-roothide"
          rm -rf "$TMP_ROOTHIDE"
          set +e
          git clone --recursive https://github.com/Roothide/Theos.git "$TMP_ROOTHIDE"
          set -e
          if [ -d "$TMP_ROOTHIDE/vendor" ]; then
              # 只拷 vendor 子目录；有冲突的文件以 roothide 为准覆盖
              cp -Rf "$TMP_ROOTHIDE/vendor/." "$THEOS/vendor/" || true
          fi
          if [ -d "$TMP_ROOTHIDE/bin" ]; then
              cp -Rf "$TMP_ROOTHIDE/bin/." "$THEOS/bin/" || true
          fi
          if [ -d "$TMP_ROOTHIDE/makefiles" ]; then
              cp -Rf "$TMP_ROOTHIDE/makefiles/." "$THEOS/makefiles/" || true
          fi
          if [ -d "$TMP_ROOTHIDE/include" ]; then
              cp -Rf "$TMP_ROOTHIDE/include/." "$THEOS/include/" || true
          fi
          rm -rf "$TMP_ROOTHIDE"
          ls "$THEOS"
          ls "$THEOS/vendor" 2>/dev/null | head -20

          # SDK：优先用 runner 自带 Xcode iPhoneOS SDK 的软链接
          mkdir -p "$THEOS/sdks"
          set +e
          SYS_SDK="$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)"
          set -e
          if [ -n "$SYS_SDK" ] && [ -d "$SYS_SDK" ]; then
              SDK_NAME="$(basename "$SYS_SDK")"
              [ -e "$THEOS/sdks/$SDK_NAME" ] || ln -s "$SYS_SDK" "$THEOS/sdks/$SDK_NAME"
              echo "Using bundled SDK: $SDK_NAME -> $SYS_SDK"
          fi
          ls -la "$THEOS/sdks" || true

          # 回退下载 xybp888/iOS-SDKs（只有在还没有任何 SDK 时才下载，很大要慢 1-3 分钟）
          if [ ! "$(ls -A $THEOS/sdks 2>/dev/null)" ]; then
              echo "Fallback: downloading iOS-SDKs ..."
              cd /tmp
              curl -fsSL -o sdks.tar.gz https://github.com/xybp888/iOS-SDKs/archive/refs/heads/master.tar.gz
              tar -xzf sdks.tar.gz -C "$THEOS/sdks" --strip-components=1 || true
              rm -f sdks.tar.gz
          fi
          echo "Final SDKs:"
          find "$THEOS/sdks" -maxdepth 2 -type d -name "iPhoneOS*.sdk" || true

      - name: Ensure THEOS env & tool versions
        shell: bash -euxo pipefail {0}
        run: |
          export THEOS="$HOME/theos"
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/dpkg/bin:/opt/homebrew/bin:$THEOS/bin:$PATH"
          echo "THEOS=$THEOS"
          test -d "$THEOS" && echo "OK: THEOS exists"
          ls "$THEOS/bin" | head -30 || true
          echo "---"
          make --version | head -1
          dpkg-deb --version | head -1 || true
          clang --version | head -1
          xcrun --find clang || true
          ldid 2>&1 | head -1 || true

      - name: Build package
        id: build
        shell: bash -euxo pipefail {0}
        run: |
          export THEOS="$HOME/theos"
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/dpkg/bin:/opt/homebrew/bin:$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=roothide
          export ARCHS=arm64e
          export SDKVERSION=17.1
          export TARGET=iphone:clang:17.1:15.0

          cd "$GITHUB_WORKSPACE"
          ls -la

          make clean 2>&1 | tail -20 || true
          set -o pipefail
          make package FINALPACKAGE=1 VERBOSE=1 2>&1 | tee build.log

          echo "--- Build output listing ---"
          find "$GITHUB_WORKSPACE" -maxdepth 3 \( -name "*.deb" -o -name "*.zip" -o -name "*.dylib" \) -ls || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          if-no-files-found: ignore
          path: |
            ./*.deb
            ./*/*.deb
            ./*/*/*.deb

  release:
    name: Create GitHub Release (tag only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: ./packages

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./packages/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
