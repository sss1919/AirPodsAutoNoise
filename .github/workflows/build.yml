name: Build Theos Package

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  THEOS: /opt/theos
  THEOS_PACKAGE_SCHEME: roothide
  SDKVERSION: '17.1'
  TARGET: iphone:clang:17.1:15.0
  ARCHS: arm64e

jobs:
  build:
    name: Build Tweak (Rootless arm64e)
    runs-on: macos-14

    steps:
      - name: "0. Early Summary header"
        run: |
          {
            echo "# Run started"
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- sha: $GITHUB_SHA (short=${GITHUB_SHA::7})"
            echo "- ref: $GITHUB_REF"
            echo "- runner.os: $RUNNER_OS / arch: $(uname -m)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "1. Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "2. Install Homebrew dependencies (tap trust safe)"
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap 2>/dev/null || true
          brew install ldid xz gnu-tar pkg-config make dpkg
          {
            for p in /usr/local/opt/make/libexec/gnubin /opt/homebrew/opt/make/libexec/gnubin /usr/local/bin /opt/homebrew/bin; do
              [ -d "$p" ] && echo "$p" >> "$GITHUB_PATH"
            done
            echo "HOMEBREW_NO_REQUIRE_TAP_TRUST=1" >> "$GITHUB_ENV"
            echo "THEOS=/opt/theos" >> "$GITHUB_ENV"
            echo "THEOS_PACKAGE_SCHEME=roothide" >> "$GITHUB_ENV"
            echo "ARCHS=arm64e" >> "$GITHUB_ENV"
            echo "SDKVERSION=17.1" >> "$GITHUB_ENV"
            echo "TARGET=iphone:clang:17.1:15.0" >> "$GITHUB_ENV"
          }
          {
            echo "## Step 2. brew install"
            echo "brew deps installed; brew shellenv paths appended; env exported to GITHUB_ENV"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "3. Cache Theos"
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            /opt/theos
            ~/theos
          key: ${{ runner.os }}-theos-roothide-v4

      - name: "4. Install Theos + SDK 17.1"
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          if [ ! -d /opt/theos/makefiles ]; then
            sudo rm -rf /opt/theos || true
            git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi
          cd /opt/theos
          git pull --ff-only || true
          git submodule update --init --recursive || true
          mkdir -p /opt/theos/sdks
          if [ ! -d /opt/theos/sdks/iPhoneOS17.1.sdk ]; then
            cd /opt/theos/sdks
            curl -fsSL -o sdks.tar.gz "https://github.com/xybp888/iOS-SDKs/archive/refs/heads/master.tar.gz" || true
            if [ -s sdks.tar.gz ]; then
              tar -xzf sdks.tar.gz --strip-components=1 -C /opt/theos/sdks || true
              rm -f sdks.tar.gz
            fi
          fi

      - name: "5. Validate Theos critical files"
        run: |
          {
            echo "## Step 5. Theos validation"
            echo "- THEOS env=${THEOS:-<empty>}"
            echo "- /opt/theos exists? $(test -d /opt/theos && echo YES || echo NO)"
            for f in /opt/theos/makefiles/common.mk /opt/theos/makefiles/tweak.mk /opt/theos/makefiles/bundle.mk /opt/theos/makefiles/aggregate.mk /opt/theos/bin/logos.pl; do
              echo "- $f exists? $(test -f "$f" && echo YES || echo NO)"
            done
            echo "- sdks available:"
            ls -1 /opt/theos/sdks 2>/dev/null | sed 's/^/  - /' || echo "  (empty)"
            echo "- brew tools:"
            for t in ldid dpkg-deb make gmake tar xz pkg-config; do
              p=$(command -v $t 2>/dev/null || echo MISSING)
              echo "  - $t: $p"
            done
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -f /opt/theos/makefiles/common.mk
          test -f /opt/theos/makefiles/tweak.mk
          test -f /opt/theos/makefiles/bundle.mk
          test -f /opt/theos/makefiles/aggregate.mk
          ls /opt/theos/sdks/iPhoneOS*.sdk/SDKSettings.json 2>/dev/null | head -1

      - name: "6. Build package (make package FINALPACKAGE=1)"
        id: build
        continue-on-error: true
        run: |
          export PATH="/opt/theos/bin:$PATH"
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=roothide
          export ARCHS=arm64e
          export SDKVERSION=17.1
          export TARGET=iphone:clang:17.1:15.0
          set -o pipefail
          (make clean >/dev/null 2>&1 || true)
          make package FINALPACKAGE=1 > build.log 2>&1
          rc=$?
          echo "rc=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "7. Post-build listing + Summary emit"
        id: check_deb
        run: |
          {
            echo "## Step 7. Post-build artifact listing"
            echo "- make.rc=${{ steps.build.outputs.rc }}"
            echo
            echo "- listing .deb in repo (maxdepth 3):"
            find . -maxdepth 3 -name "*.deb" -ls 2>/dev/null || echo "  (none)"
            echo
            echo "- packages/ dir listing:"
            (ls -la packages/ 2>/dev/null || echo "  (no packages/ dir)")
            echo
            echo "- .theos/ dir top-level (staging hint):"
            (ls -la .theos/ 2>/dev/null || echo "  (no .theos/ dir)")
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          set +e
          DEB="$(find . -maxdepth 3 -name "*.deb" -print | head -n 1)"
          if [ -n "$DEB" ] && [ -s "$DEB" ]; then
            echo "deb_exists=true" >> "$GITHUB_OUTPUT"
            echo "deb_path=$DEB"   >> "$GITHUB_OUTPUT"
            {
              echo "### Green light - .deb produced"
              echo "- path: \`$DEB\`"
              echo "- size: $(wc -c < "$DEB" | tr -d ' ') bytes"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null
          else
            echo "deb_exists=false" >> "$GITHUB_OUTPUT"
            echo "deb_path="         >> "$GITHUB_OUTPUT"
            {
              echo "### Red light - NO .deb produced"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null
          fi
          exit 0

      - name: "8. Emit build.log into Summary (always)"
        if: always()
        run: |
          {
            echo "## Step 8. build.log - full length"
            if [ -s build.log ]; then
              echo "--- START build.log ---"
              cat build.log
              echo "--- END build.log ---"
            else
              echo "(build.log missing or empty)"
            fi
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null
          mkdir -p build-log
          cp -f build.log build-log/build.log 2>/dev/null || true
          ls -la build-log/

      - name: "9. Upload build.log artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log/

      - name: "10. Upload .deb artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: "**/*.deb"
          if-no-files-found: ignore

      - name: "11. Fail workflow if no .deb"
        if: steps.check_deb.outputs.deb_exists != 'true'
        run: |
          echo "No .deb artifact produced (make.rc=${{ steps.build.outputs.rc }}). Marking workflow FAILED." >&2
          exit 3
