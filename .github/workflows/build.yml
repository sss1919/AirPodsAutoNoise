name: Build Theos Package

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  THEOS: /Users/runner/theos
  THEOS_PACKAGE_SCHEME: roothide
  SDKVERSION: '17.1'
  TARGET: iphone:clang:17.1:15.0
  ARCHS: arm64e

jobs:
  build:
    name: Build Tweak (Rootless arm64e)
    runs-on: macos-14
    permissions:
      contents: read

    defaults:
      run:
        shell: bash -lc {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Print runner info
        run: |
          {
            echo '### Runner info'
            echo '```'
            uname -a
            sw_vers || true
            xcodebuild -version || true
            xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true
            which git make clang xcrun ldid dpkg-deb || true
            echo HOME="$HOME"
            echo GITHUB_WORKSPACE="$GITHUB_WORKSPACE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set +e
          {
            echo '### brew install (non-fatal on tap warnings)'
            echo '```'
            echo '--- brew tap ---'
            brew tap
            echo '--- untap aws/tap ---'
            brew untap aws/tap 2>&1
            echo '--- brew install ---'
            brew install --formula ldid xz gnu-tar pkg-config make dpkg 2>&1 | tail -n 120
            echo '--- versions ---'
            command -v ldid dpkg-deb gmake make || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -e

          {
            echo "THEOS=${THEOS}"
            echo "THEOS_PACKAGE_SCHEME=${THEOS_PACKAGE_SCHEME}"
            echo "SDKVERSION=${SDKVERSION}"
            echo "TARGET=${TARGET}"
            echo "ARCHS=${ARCHS}"
          } >> "$GITHUB_ENV"

      - name: Cache Theos + SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/theos
            /Users/runner/sdks
          key: theos-roothide-arm64e-macos14-v1-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            theos-roothide-arm64e-macos14-v1-

      - name: Setup Theos + RootHide overlay + iPhoneOS SDK
        run: |
          {
            echo '### Setup Theos / RootHide / SDK'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -d "$THEOS" ] && [ -f "$THEOS/makefiles/common.mk" ] && [ -f "$THEOS/makefiles/tweak.mk" ]; then
            echo "[cache-hit] THEOS restored, skipping bootstrap" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            set -e
            echo "[cache-miss] bootstrapping THEOS..." | tee -a "$GITHUB_STEP_SUMMARY"

            git clone --recursive https://github.com/theos/theos.git "$THEOS" 2>&1 | tail -n 40 | tee -a "$GITHUB_STEP_SUMMARY"

            for d in vendor bin makefiles include; do
              rm -rf "$THEOS/$d" 2>/dev/null || true
              git clone --depth 1 --single-branch https://github.com/Roothide/Theos.git "$THEOS/.roothide-src-$d" 2>&1 | tail -n 5 | tee -a "$GITHUB_STEP_SUMMARY" || true
              if [ -d "$THEOS/.roothide-src-$d/$d" ]; then
                cp -R "$THEOS/.roothide-src-$d/$d" "$THEOS/$d"
              fi
              rm -rf "$THEOS/.roothide-src-$d"
            done

            export PATH="$THEOS/bin:$PATH"
            echo "PATH=$PATH" | tee -a "$GITHUB_ENV"
          fi

          set +e
          {
            echo '--- THEOS layout (top) ---'
            ls -la "$THEOS" 2>&1 | head -n 60
            echo '--- THEOS makefiles ---'
            ls -la "$THEOS/makefiles" 2>&1 | head -n 80
            echo '--- THEOS bin ---'
            ls -la "$THEOS/bin" 2>&1 | head -n 80
            echo '--- THEOS vendor ---'
            ls -la "$THEOS/vendor" 2>&1 | head -n 40
            echo '--- common.mk / tweak.mk present? ---'
            for f in "$THEOS/makefiles/common.mk" "$THEOS/makefiles/tweak.mk" "$THEOS/bin/dnicetype"; do
              if [ -e "$f" ]; then echo "OK  $f"; else echo "MISS $f"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -e

          mkdir -p "$HOME/sdks" || true
          SDK_FROM_XCRUN="$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)"
          {
            echo '### SDK info'
            echo '```'
            echo "SDK_FROM_XCRUN=$SDK_FROM_XCRUN"
            ls -la "$HOME/sdks" 2>&1 | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$SDK_FROM_XCRUN" ]; then
            set -e
            if ! command -v xcodes >/dev/null 2>&1; then
              brew install --formula xcodesorg/made/xcodes 2>&1 | tail -n 30 | tee -a "$GITHUB_STEP_SUMMARY" || true
            fi
            if command -v xcodes >/dev/null 2>&1; then
              xcodes install 15.2 --select 2>&1 | tail -n 40 | tee -a "$GITHUB_STEP_SUMMARY" || true
            fi
          fi

      - name: Pre-build debug dump (always run)
        run: |
          set +e
          {
            echo '### Build Environment'
            echo '```'
            echo "THEOS=$THEOS"
            echo "THEOS_PACKAGE_SCHEME=$THEOS_PACKAGE_SCHEME"
            echo "SDKVERSION=$SDKVERSION"
            echo "TARGET=$TARGET"
            echo "ARCHS=$ARCHS"
            echo "PATH=$PATH"
            echo '--- which theos bins ---'
            which theos theos-build logify 2>&1
            echo '--- ls THEOS/makefiles/*.mk ---'
            ls "$THEOS/makefiles"/*.mk 2>&1 | head -n 50
            echo '--- ls THEOS/sdks ---'
            ls -la "$THEOS/sdks" 2>&1 | head -n 30
            echo '--- xcrun sdk iphoneos ---'
            xcrun --sdk iphoneos --show-sdk-path 2>&1
            xcrun --sdk iphoneos --show-sdk-version 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -e

      - name: Build package (make package THEOS_PACKAGE_SCHEME=roothide)
        id: build
        continue-on-error: true
        run: |
          {
            echo '### Build Environment'
            echo '```'
            set | grep -E '^(THEOS|SDK|TARGET|ARCHS|PATH|HOME|GITHUB)' 2>&1 | head -n 40 || true
            echo '--- env from workflow ---'
            echo THEOS="$THEOS"
            echo THEOS_PACKAGE_SCHEME="$THEOS_PACKAGE_SCHEME"
            echo SDKVERSION="$SDKVERSION"
            echo TARGET="$TARGET"
            echo ARCHS="$ARCHS"
            echo '--- THEOS dir sanity ---'
            for f in "$THEOS/makefiles/common.mk" "$THEOS/makefiles/tweak.mk"; do
              if [ -f "$f" ]; then echo "OK  $f"; else echo "MISSING $f"; fi
            done
            ls -la "$THEOS/makefiles" 2>&1 | head -n 50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          BUILD_LOG="$RUNNER_TEMP/build.log"
          set +e
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$THEOS_PACKAGE_SCHEME" SDKVERSION="$SDKVERSION" TARGET="$TARGET" ARCHS="$ARCHS" 2>&1 | tee "$BUILD_LOG" | tail -n 80 | tee -a "$GITHUB_STEP_SUMMARY"
          RC="${PIPESTATUS[0]}"
          set -e

          {
            echo "### Build result: exit=$RC"
            if [ -f "$BUILD_LOG" ]; then
              echo "build.log bytes: $(wc -c < "$BUILD_LOG" | tr -d ' ')"
            fi
            echo ''
            echo '### Full build.log (last 300 lines)'
            echo '```'
            if [ -f "$BUILD_LOG" ]; then tail -n 300 "$BUILD_LOG"; fi
            echo '```'

            if [ "$RC" -ne 0 ]; then
              echo ''
              echo '### Environment & THEOS layout (on failure only)'
              echo '```'
              set | grep -i -E 'theos|sdk|target|arch|path|root' | head -n 60
              echo '---'
              ls -la "$THEOS" 2>&1 | head -n 50
              ls -la "$THEOS/makefiles" 2>&1 | head -n 80
              echo '---'
              find "$THEOS" -maxdepth 3 -type d 2>&1 | head -n 80
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "build-log-path=$BUILD_LOG" >> "$GITHUB_OUTPUT"

          exit "$RC"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ steps.build.outputs.build-log-path }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.deb
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
