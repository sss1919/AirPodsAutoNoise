name: Build Theos Package

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  THEOS: /Users/runner/theos
  THEOS_PACKAGE_SCHEME: roothide
  SDKVERSION: '17.1'
  TARGET: iphone:clang:17.1:15.0
  ARCHS: arm64e

jobs:
  build:
    name: Build Tweak (Rootless arm64e)
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Print runner info
        shell: bash -euxo pipefail {0}
        run: |
          {
            echo '### Runner info'
            echo '```'
            uname -a
            sw_vers || true
            xcodebuild -version || true
            xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true
            which git make clang xcrun ldid dpkg-deb || true
            echo HOME="$HOME"
            echo GITHUB_WORKSPACE="$GITHUB_WORKSPACE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Homebrew dependencies
        shell: bash -euxo pipefail {0}
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          {
            echo '### brew install'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 先处理 tap trust，避免 brew install 因为 aws/tap 报错
          set +e
          brew tap 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          brew untap aws/tap 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          set -e

          brew install --formula ldid xz gnu-tar pkg-config make dpkg 2>&1 | tail -100 | tee -a "$GITHUB_STEP_SUMMARY" || true

          {
            echo ''
            echo '--- post-install versions ---'
            ldid 2>&1 | head -1 || true
            make --version | head -1 || true
            dpkg-deb --version | head -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 关键：把后续 step 要用的 PATH / THEOS / SDKVERSION 全部注入
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/dpkg/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "SDKVERSION=17.1" >> "$GITHUB_ENV"
          echo "TARGET=iphone:clang:17.1:15.0" >> "$GITHUB_ENV"
          echo "ARCHS=arm64e" >> "$GITHUB_ENV"
          echo "THEOS_PACKAGE_SCHEME=roothide" >> "$GITHUB_ENV"

      - name: Cache Theos + SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/theos
          key: ${{ runner.os }}-roothide-theos-v5-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-roothide-theos-v5-
            ${{ runner.os }}-roothide-theos-v4-
            ${{ runner.os }}-roothide-theos-v3-
            ${{ runner.os }}-roothide-theos-v2-
            ${{ runner.os }}-roothide-theos-

      - name: Install RootHide Theos + SDKs
        if: steps.cache-theos.outputs.cache-hit != 'true'
        shell: bash -euxo pipefail {0}
        run: |
          echo "Installing RootHide-aware Theos to $THEOS ..."

          if [ -d "$THEOS" ]; then
              echo "Removing stale $THEOS to avoid unrelated histories ..."
              rm -rf "$THEOS"
          fi

          echo '### Theos install log' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (set -x
            # 1) 官方 Theos（稳定）
            git clone --recursive https://github.com/theos/theos.git "$THEOS" 2>&1 | tail -50 | tee -a "$GITHUB_STEP_SUMMARY"

            # 2) 叠加 Roothide 的 vendor/bin/makefiles/include
            TMP_ROOTHIDE="$HOME/.tmp-roothide"
            rm -rf "$TMP_ROOTHIDE"
            set +e
            git clone --recursive https://github.com/Roothide/Theos.git "$TMP_ROOTHIDE" 2>&1 | tail -20 | tee -a "$GITHUB_STEP_SUMMARY"
            set -e
            for d in vendor bin makefiles include; do
                [ -d "$TMP_ROOTHIDE/$d" ] || continue
                cp -Rf "$TMP_ROOTHIDE/$d/." "$THEOS/$d/" || true
            done
            rm -rf "$TMP_ROOTHIDE"

            # 3) SDKs：优先链接 Xcode 自带，否则 fallback 下载
            mkdir -p "$THEOS/sdks"
            set +e
            SYS_SDK="$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)"
            set -e
            if [ -n "$SYS_SDK" ] && [ -d "$SYS_SDK" ]; then
                SDK_NAME="$(basename "$SYS_SDK")"
                [ -e "$THEOS/sdks/$SDK_NAME" ] || ln -s "$SYS_SDK" "$THEOS/sdks/$SDK_NAME"
                echo "Using bundled SDK: $SDK_NAME -> $SYS_SDK" | tee -a "$GITHUB_STEP_SUMMARY"
            fi

            if [ ! "$(ls -A $THEOS/sdks 2>/dev/null)" ]; then
                echo "Fallback: downloading iOS-SDKs ..." | tee -a "$GITHUB_STEP_SUMMARY"
                cd /tmp
                curl -fsSL -o sdks.tar.gz https://github.com/xybp888/iOS-SDKs/archive/refs/heads/master.tar.gz 2>&1 | tail -5 | tee -a "$GITHUB_STEP_SUMMARY"
                tar -xzf sdks.tar.gz -C "$THEOS/sdks" --strip-components=1 2>&1 | tail -5 | tee -a "$GITHUB_STEP_SUMMARY" || true
                rm -f sdks.tar.gz
            fi

            echo "Final SDKs dir:" | tee -a "$GITHUB_STEP_SUMMARY"
            ls -la "$THEOS/sdks" | head -30 | tee -a "$GITHUB_STEP_SUMMARY"
          )
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure THEOS env & tool versions
        shell: bash -euxo pipefail {0}
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/dpkg/bin:/opt/homebrew/bin:$THEOS/bin:$PATH"
          {
            echo '### Environment & THEOS layout'
            echo '```'
            echo THEOS="$THEOS"
            echo SDKVERSION="$SDKVERSION"
            echo TARGET="$TARGET"
            echo ARCHS="$ARCHS"
            echo THEOS_PACKAGE_SCHEME="$THEOS_PACKAGE_SCHEME"
            echo PATH="$PATH"
            test -d "$THEOS" && echo OK: THEOS exists
            ls "$THEOS" | tee /tmp/theos_top.txt || true
            echo '--- THEOS makefiles common.mk exist? ---'
            [ -f "$THEOS/makefiles/common.mk" ] && echo OK: common.mk || echo MISSING: common.mk
            [ -f "$THEOS/makefiles/tweak.mk" ] && echo OK: tweak.mk || echo MISSING: tweak.mk
            echo '--- THEOS/bin ---'
            ls "$THEOS/bin" | head -30 || true
            echo '--- tool versions ---'
            make --version | head -1
            dpkg-deb --version | head -1 || true
            clang --version | head -1
            xcrun --find clang || true
            ldid 2>&1 | head -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build package
        id: build
        shell: bash -euxo pipefail {0}
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/dpkg/bin:/opt/homebrew/bin:$THEOS/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          ls -la

          {
            echo '### Build environment'
            echo '```'
            ( set -x
              env | sort | grep -E '^(THEOS|SDK|TARGET|ARCHS|PACKAGE|PATH|SDKS|THEOS_' || true
              make --version | head -1
              test -f Makefile && echo "OK: Makefile present"
              test -d "$THEOS" && echo "OK: THEOS=$THEOS"
              bash -lc 'test -d "$THEOS" && echo OK: bash-login THEOS=$THEOS || echo MISSING THEOS in bash-login; echo THEOS=$THEOS; export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/opt/dpkg/bin:/opt/homebrew/bin:$THEOS/bin:$PATH"; which make; which dpkg-deb'
            ) 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```'
            echo ''
            echo '### Build log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          make clean 2>&1 | tail -60 | tee -a "$GITHUB_STEP_SUMMARY" || true
          set +e
          set -o pipefail
          make package FINALPACKAGE=1 VERBOSE=1 2>&1 | tee build.log | tail -n 500 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          {
            echo '### Build output'
            echo '```'
            find "$GITHUB_WORKSPACE" -maxdepth 3 \( -name "*.deb" -o -name "*.zip" -o -name "*.dylib" \) -ls 2>&1 || true
            echo '```'
            if [ "$rc" -ne 0 ]; then
                echo ''
                echo '### THEOS + sdks top listing (on failure)'
                echo '```'
                ls -la "$THEOS" 2>&1 | head -50 || true
                echo '---'
                ls -la "$THEOS/sdks" 2>&1 | head -50 || true
                echo '```'
                echo ''
                echo '### Full build.log (first 300 lines)'
                echo '```'
                head -n 300 build.log 2>/dev/null || true
                echo '```'
                echo ''
                echo '### Full build.log (last 300 lines)'
                echo '```'
                tail -n 300 build.log 2>/dev/null || true
                echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$rc"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          if-no-files-found: ignore
          path: |
            ./*.deb
            ./*/*.deb
            ./*/*/*.deb

  release:
    name: Create GitHub Release (tag only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: ./packages

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./packages/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
